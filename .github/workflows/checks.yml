name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    name: Files and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check project files and syntax
        run: node tests/project-check.cjs
  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Unit and integration tests
        shell: bash
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          npm test 2>&1 | tee .ci-logs/tests.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: .ci-logs/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
  browsers:
    runs-on: ubuntu-24.04
    # The Playwright install plus the apt steps can push a slow runner past a
    # shorter budget; a cancelled leg shows up as "The operation was canceled".
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps ${{ matrix.engine }}
      - name: Prepare virtual audio for real speech tests
        timeout-minutes: 15
        shell: bash
        run: |
          ok=0
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y pulseaudio pulseaudio-utils; then ok=1; break; fi
            echo "apt-get attempt $attempt failed; retrying after backoff" >&2
            sleep $((attempt*20))
          done
          [ "$ok" = 1 ] || { echo "pulseaudio could not be installed" >&2; exit 1; }
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=pongy_test_sink
          pactl set-default-sink pongy_test_sink
      - name: Browser tests
        shell: bash
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          npm run test:ui 2>&1 | tee .ci-logs/browser.log
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.engine }}
          path: |
            .ci-logs/
            tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
  all-checks:
    name: All checks
    if: ${{ always() }}
    needs: [structure, security, test, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report overall result
        env:
          STRUCTURE: ${{ needs.structure.result }}
          SECURITY: ${{ needs.security.result }}
          TESTS: ${{ needs.test.result }}
          BROWSERS: ${{ needs.browsers.result }}
        shell: bash
        run: |
          echo "Files: $STRUCTURE; dependency audit: $SECURITY; tests: $TESTS; browsers: $BROWSERS"
          echo "## Project check results" >> "$GITHUB_STEP_SUMMARY"
          printf '| Files | Dependencies | Tests | Browsers |\n|---|---|---|---|\n| %s | %s | %s | %s |\n' "$STRUCTURE" "$SECURITY" "$TESTS" "$BROWSERS" >> "$GITHUB_STEP_SUMMARY"
          for result in "$STRUCTURE" "$SECURITY" "$TESTS" "$BROWSERS"; do
            if [ "$result" != "success" ]; then
              echo "A required check failed, was cancelled, or was skipped. Open the corresponding job."
              exit 1
            fi
          done
