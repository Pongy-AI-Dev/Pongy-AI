name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Unit and integration tests
        shell: bash
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          npm test 2>&1 | tee .ci-logs/tests.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: .ci-logs/
          if-no-files-found: ignore
          retention-days: 7
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps ${{ matrix.engine }}
      - name: Browser tests
        shell: bash
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          npm run test:ui 2>&1 | tee .ci-logs/browser.log
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.engine }}
          path: |
            .ci-logs/
            tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7
